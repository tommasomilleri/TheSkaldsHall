<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="70" viewBox="0 0 900 70">
  <defs>
    <pattern id="braid" width="40" height="24" patternUnits="userSpaceOnUse" y="23">
      <g fill="none">
        <path d="M0,6 C10,6 10,18 20,18" stroke="#050505" stroke-width="8"/>
        <path d="M0,6 C10,6 10,18 20,18" stroke="#7d7d7d" stroke-width="4.5"/>
        <path d="M0,18 C10,18 10,6 20,6 C30,6 30,18 40,18" stroke="#050505" stroke-width="8"/>
        <path d="M0,18 C10,18 10,6 20,6 C30,6 30,18 40,18" stroke="#7d7d7d" stroke-width="4.5"/>
        <path d="M20,18 C30,18 30,6 40,6" stroke="#050505" stroke-width="8"/>
        <path d="M20,18 C30,18 30,6 40,6" stroke="#7d7d7d" stroke-width="4.5"/>
      </g>
    </pattern>
    <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="mL"><rect x="0" y="0" width="400" height="70" fill="url(#fadeL)"/></mask>
    <mask id="mR"><rect x="500" y="0" width="400" height="70" fill="url(#fadeR)"/></mask>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="disc"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0c0c0c"/></radialGradient>
    <style>
      .p{animation:p 4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
    </style>
  </defs>
  <rect x="0" y="23" width="400" height="24" fill="url(#braid)" mask="url(#mL)"/>
  <rect x="500" y="23" width="400" height="24" fill="url(#braid)" mask="url(#mR)"/>
  <circle cx="450" cy="35" r="30" fill="url(#disc)" stroke="#050505" stroke-width="6"/>
  <circle cx="450" cy="35" r="30" fill="none" stroke="#7d7d7d" stroke-width="2.5"/>
  <circle cx="450" cy="35" r="23" fill="none" stroke="#3a3a3a" stroke-width="1"/>
  <g class="p" transform="translate(440,20)" fill="none" stroke="#f5f8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M3,30 L15,16 L9,8 L3,16 L15,30" transform="translate(1,0)"/>
  </g>
</svg>